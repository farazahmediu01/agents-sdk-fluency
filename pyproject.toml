[project]
name = "agents-sdk-fluency"
version = "0.1.0"
description = "A curriculum that makes you fluent in the OpenAI Agents SDK - hand-roll only what you must picture while debugging, everything else is SDK from first contact"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=2.43.0",
    "openai-agents>=0.20.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

# =============================================================================
# Build backend.
#
# Present for exactly one reason: it makes `shared/` an installed package, so
# every chapter can `from shared.models import make_model` no matter which
# directory its script lives in. Without this, `uv sync` treats the repo as a
# "virtual" project and installs nothing, and only sibling-file imports work.
#
# Chapter folders (01_agent_loop, ...) are NOT packages — their names start with
# a digit, so they are not valid Python identifiers. They stay script-style, and
# `packages` below lists the one thing we do ship.
# =============================================================================
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared"]

# =============================================================================
# Quality gate.
#
# Three tools, one job each. They run in this order because each one is cheaper
# than the next:
#
#   ruff format   — style.   Non-negotiable, automatic, never argued about.
#   ruff check    — lint.    Bugs and smells a linter can see without running code.
#   pyright       — types.   Bugs a linter cannot see without understanding types.
#   pytest        — proof.   Bugs nothing can see without running the code.
#
# Every chapter must pass all four before it is considered done. This is the
# same bar a production Python repo holds, and there is no reason a teaching
# repo should hold a lower one.
# =============================================================================

[tool.ruff]
line-length = 100
target-version = "py312"
# Script-style folders: modules live next to each other and import by bare name
# (`from tools import ...`). Listing them here tells ruff's import sorter that
# those are OUR modules, not third-party packages.
src = [
    ".",
    "shared",
    "00_python_for_agents/examples",
    "00_python_for_agents/solutions",
    "00_python_for_agents/exercises",
    "01_agent_loop/from_scratch",
    "01_agent_loop/solutions",
    "01_agent_loop/with_sdk",
    "02_typed_tools/from_scratch",
    "02_typed_tools/solutions",
    "02_typed_tools/with_sdk",
    "02_typed_tools/exercises",
    "03_structured_outputs/from_scratch",
    "03_structured_outputs/solutions",
    "03_structured_outputs/with_sdk",
    "03_structured_outputs/exercises",
    "04_sessions_state/solutions",
    "04_sessions_state/with_sdk",
    "04_sessions_state/exercises",
    "05_context_window/spike",
    "05_context_window/with_sdk",
    "05_context_window/solutions",
    "05_context_window/exercises",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes — undefined names, unused imports
    "I",    # isort — import order
    "UP",   # pyupgrade — modern syntax (X | None over Optional[X])
    "B",    # flake8-bugbear — real bug patterns (mutable defaults, etc.)
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff's own rules
]
ignore = [
    "E501",  # line length — the formatter owns this; strings/URLs may overflow
    "B008",  # function call in default arg — FastAPI's Depends() idiom, later chapters
]

[tool.ruff.lint.per-file-ignores]
# Teaching files deliberately show the WRONG way before the right way.
"**/break_it.py" = ["B017", "SIM105"]

[tool.ruff.format]
docstring-code-format = true
# Chapter READMEs contain code that is deliberately wrong, deliberately
# incomplete, or a `# ...` sketch. The formatter must not touch prose files.
exclude = ["*.md"]

[tool.pyright]
include = [
    "shared",
    "00_python_for_agents",
    "01_agent_loop",
    "02_typed_tools",
    "03_structured_outputs",
    "04_sessions_state",
    "05_context_window",
]
exclude = ["**/__pycache__", ".venv"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

# Every chapter has its own `tools.py`, and every chapter's scripts import it by
# bare name (`from tools import ...`) because they are run as scripts, not as
# packages. A single flat `extraPaths` cannot express that: it would put four
# different `tools.py` files on one search path and resolve them all to whichever
# came first — which is not a real error, just a lookup collision, and it gets
# worse with every chapter added.
#
# `executionEnvironments` is the fix. Each entry scopes a search path to one
# directory, so `01_agent_loop/from_scratch/agent.py` sees ITS `tools.py` and
# `02_typed_tools/from_scratch/agent.py` sees ITS one. Add one block per new
# script-style folder; nothing above it needs to change.
[[tool.pyright.executionEnvironments]]
root = "00_python_for_agents/examples"
extraPaths = ["00_python_for_agents/examples"]

[[tool.pyright.executionEnvironments]]
root = "00_python_for_agents/solutions"
extraPaths = ["00_python_for_agents/solutions"]

[[tool.pyright.executionEnvironments]]
root = "00_python_for_agents/exercises"
extraPaths = ["00_python_for_agents/exercises", "00_python_for_agents/solutions"]

[[tool.pyright.executionEnvironments]]
root = "01_agent_loop/from_scratch"
extraPaths = ["01_agent_loop/from_scratch"]

[[tool.pyright.executionEnvironments]]
root = "01_agent_loop/solutions"
extraPaths = ["01_agent_loop/solutions"]

[[tool.pyright.executionEnvironments]]
root = "02_typed_tools/from_scratch"
extraPaths = ["02_typed_tools/from_scratch"]

[[tool.pyright.executionEnvironments]]
root = "02_typed_tools/solutions"
extraPaths = ["02_typed_tools/solutions", "02_typed_tools/from_scratch"]

# The student's own workspace. Wired in so exercise code is held to the same
# gate as the reference code — and so `from my_tool import tool` resolves.
[[tool.pyright.executionEnvironments]]
root = "02_typed_tools/exercises"
extraPaths = ["02_typed_tools/exercises", "02_typed_tools/from_scratch"]

[[tool.pyright.executionEnvironments]]
root = "03_structured_outputs/from_scratch"
extraPaths = ["03_structured_outputs/from_scratch"]

# Chapter 3 is where the spine becomes ONE codebase (see "The Taper Rule").
# Rather than copy Chapter 2's storage and tools forward a third time, Chapter 3
# imports them. That is what "the app grows, it is not rebuilt" has to mean in
# practice, and it is why these two extra paths are here.
[[tool.pyright.executionEnvironments]]
root = "03_structured_outputs/solutions"
extraPaths = [
    "03_structured_outputs/solutions",
    "02_typed_tools/solutions",
    "02_typed_tools/from_scratch",
]

[[tool.pyright.executionEnvironments]]
root = "03_structured_outputs/exercises"
extraPaths = ["03_structured_outputs/exercises"]

# Chapter 4 stacks one more layer on the same spine: it imports Chapter 3's
# `replies` and Chapter 2's `expense_tools` / `expense_store` / `chapter`.
# Nothing was copied forward, so the path list grows by exactly one entry per
# chapter — which is the cost of "one app that grows", paid here.
[[tool.pyright.executionEnvironments]]
root = "04_sessions_state/solutions"
extraPaths = [
    "04_sessions_state/solutions",
    "03_structured_outputs/solutions",
    "02_typed_tools/solutions",
    "02_typed_tools/from_scratch",
]

[[tool.pyright.executionEnvironments]]
root = "04_sessions_state/with_sdk"
extraPaths = [
    "04_sessions_state/with_sdk",
    "04_sessions_state/solutions",
    "03_structured_outputs/solutions",
    "02_typed_tools/solutions",
    "02_typed_tools/from_scratch",
]

[[tool.pyright.executionEnvironments]]
root = "04_sessions_state/exercises"
extraPaths = ["04_sessions_state/exercises"]

# Chapter 5. `spike/` needs its own block because `orphan_400.py` imports `trim`
# by bare name from the same folder -- the standing reason, one chapter later.
[[tool.pyright.executionEnvironments]]
root = "05_context_window/spike"
extraPaths = ["05_context_window/spike"]

[[tool.pyright.executionEnvironments]]
root = "05_context_window/with_sdk"
extraPaths = [
    "05_context_window/with_sdk",
    "04_sessions_state/with_sdk",
    "04_sessions_state/solutions",
    "03_structured_outputs/solutions",
    "02_typed_tools/solutions",
    "02_typed_tools/from_scratch",
]

[[tool.pyright.executionEnvironments]]
root = "05_context_window/solutions"
extraPaths = [
    "05_context_window/solutions",
    "04_sessions_state/solutions",
    "03_structured_outputs/solutions",
    "02_typed_tools/solutions",
    "02_typed_tools/from_scratch",
]

[[tool.pyright.executionEnvironments]]
root = "05_context_window/exercises"
extraPaths = ["05_context_window/exercises"]

[[tool.pyright.executionEnvironments]]
root = "."

[tool.pytest.ini_options]
# Only `test_*.py` is collected. `check_*.py` harnesses cost real API calls and
# are run deliberately, never as part of `uv run pytest`.
testpaths = [
    "shared",
    "00_python_for_agents",
    "01_agent_loop",
    "02_typed_tools",
    "03_structured_outputs",
    "04_sessions_state",
    "05_context_window",
]
python_files = ["test_*.py"]
addopts = "-q"
